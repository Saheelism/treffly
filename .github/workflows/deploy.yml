name: Build data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1' # Mondays 02:17 UTC: refresh timetable and venues
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The timetable is downloaded at most once per week and kept in the free Actions cache,
      # so frequent code updates do not put load on MVV's server.
      - name: Week number
        id: week
        run: echo "w=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cached timetable
        id: gtfscache
        uses: actions/cache@v4
        with:
          path: gtfs.zip
          key: gtfs-${{ steps.week.outputs.w }}
      - name: Download MVV timetable (GTFS, CC BY 4.0)
        if: steps.gtfscache.outputs.cache-hit != 'true'
        run: curl -fsSL -A "Treffly/1.0 (https://github.com/Saheelism/treffly)" -o gtfs.zip https://www.mvv-muenchen.de/fileadmin/mediapool/developer/opendata/gesamt_gtfs.zip
      - name: Unpack timetable
        run: |
          unzip -q -o gtfs.zip -d gtfs
          ls -la gtfs
      - name: Build travel-time tables
        run: node --max-old-space-size=6144 pipeline/build.mjs gtfs public/data
      # Places come from the public Overpass API: one query per week at most (cached), well within its usage policy.
      - name: Cached places
        id: venuecache
        uses: actions/cache@v4
        with:
          path: public/data/venues.json
          key: venues-${{ steps.week.outputs.w }}
      - name: Fetch places from OpenStreetMap
        if: steps.venuecache.outputs.cache-hit != 'true'
        run: node pipeline/venues.mjs public/data
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
