name: Build data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1' # Mondays 02:17 UTC: refresh timetable and venues
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download MVV timetable (GTFS, CC BY 4.0)
        run: |
          curl -fsSL -A "Treffly/1.0 (https://github.com/Saheelism/treffly)" -o gtfs.zip https://www.mvv-muenchen.de/fileadmin/mediapool/developer/opendata/gesamt_gtfs.zip
          unzip -q -o gtfs.zip -d gtfs
          ls -la gtfs
      - name: Build travel-time tables
        run: node --max-old-space-size=6144 pipeline/build.mjs gtfs public/data
      - name: Fetch places from OpenStreetMap
        run: node pipeline/venues.mjs public/data
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
